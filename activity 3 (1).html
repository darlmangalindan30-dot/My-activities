<!DOCTYPE html>
<html>
<head>
    <title>Recipe of Instant Noodles</title>

    <style>
        body {
            background-color: #fff8e1;
            padding: 25px;
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            color: #d84315;
            background: white;
            padding: 12px;
            border: 4px solid #ff9800;
            text-align: center;
            width: fit-content;
        }

        h2 {
            color: #2e7d32;
            border-bottom: 2px solid #81c784;
            padding-bottom: 5px;
        }

        ul, ol {
            background: white;
            padding: 15px 25px;
            margin-top: 8px;
            font-size: 16px;
        }

        li {
            margin: 5px 0;
        }
    </style>
</head>

<body>

    <h1>Recipe of Instant Noodles</h1>

    <h2>Ingredients</h2>

    <ul>
        <li>1 pack of Lucky Me</li>
        <li>2 cups of water</li>
        <li>1 egg (optional)</li>
    </ul>

    <h2>Steps</h2>

    <ol>
        <li>Boil water in a pot.</li>
        <li>Add noodles and cook for 2–5 minutes.</li>
        <li>Put the seasoning and stir well.</li>
        <li>Add the egg.</li>
        <li>Transfer to a bowl and eat.</li>
    </ol>

</body>
</html>
